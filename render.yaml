services:
  - type: web
    name: zanzora-discover
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn zanzora.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: zanzora-db
          property: connectionString

databases:
  - name: zanzora-db
    plan: free
    databaseName: zanzora
    user: zanzora
