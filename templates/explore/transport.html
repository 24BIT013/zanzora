{% extends 'explore/base.html' %}{% block title %}Transfers — Zanzora Discover{% endblock %}{% block content %}<main class="form-page transfer-page"><section class="transport"><div class="transport-form"><p class="eyebrow">Move beautifully</p><h2>Arrange your<br>island <i>transfer.</i></h2><p>Private, reliable rides from airport arrivals to beach hideaways and every stop between.</p><form method="post" action="{% url 'transport' %}">{% csrf_token %}<div class="form-row"><label>Name<input required name="name" placeholder="Your name"></label><label>Email<input required type="email" name="email" placeholder="you@email.com"></label></div><div class="form-row"><label>Pickup<input required name="pickup" placeholder="Airport or hotel"></label><label>Destination<input required name="destination" placeholder="Where to?"></label></div><div class="form-row"><label>Date<input required type="date" name="pickup_date"></label><label>Passengers<select name="passengers"><option value="2">2 people</option><option value="1">1 person</option><option value="4">3–4 people</option><option value="6">5+ people</option></select></label></div><label>Notes<textarea name="notes" placeholder="Flight number, child seats, or any details..."></textarea></label><button class="button dark">Request a transfer <span>↗</span></button></form></div></section></main>{% endblock %}
